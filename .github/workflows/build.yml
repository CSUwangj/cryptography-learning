name: Build

on: [push, pull_request]

# Backend and frontend build on every push as independent jobs, plus a
# characterization baseline against the Linux web-tier image. Jobs stay
# separate so a frontend failure still tells you whether the backend compiles
# and whether the container baseline still holds.
#
# There are deliberately no `paths` filters. The two halves are coupled through the
# GraphQL schema, so "only the frontend changed" is not a safe reason to skip the
# backend. The schema parity gate below enforces that coupling on every push.
#
# Each job installs from its lockfile — `cargo --locked` and `npm ci` — so a
# transitive release cannot change what CI built. The publish path needs the same
# treatment and is CSUAuroraLab/cryptography-learning-infra#5.

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Test
        # Includes schema_parity: backend SDL vs frontend/schema/schema.gql.
        run: cargo test --locked -- --nocapture

      - name: Build
        run: cargo build --locked --release

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node is exact-pinned in frontend/.nvmrc (and package.json engines);
          # npm 11 ships with that Node release and is also listed under engines.
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install from the lockfile
        run: npm ci

      - name: Verify GraphQL codegen is up to date
        # Client-preset output under src/transport/generated must match a fresh
        # `npm run gen` (issue #16 clean-tree contract).
        run: |
          npm run gen
          if [ -n "$(git status --porcelain -- .)" ]; then
            echo "GraphQL codegen left the frontend tree dirty:"
            git status --porcelain -- .
            git diff -- .
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        # VITE_FEEDBACK_URL is baked into the bundle at build time, so it has
        # to be set here to produce the bundle the site actually ships.
        run: npm run build
        env:
          VITE_FEEDBACK_URL: https://github.com/CSUAuroraLab/ISSUE-COLLECTOR/issues/new/choose

  baseline:
    name: Characterization baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build and load web-tier image
        # Restore/export BuildKit layers via a dedicated GHA cache scope so cold
        # and warm runs share intermediate stages. Host-side node_modules, the
        # frontend bundle, and GraphQL codegen output are not path-cached here —
        # only opaque BuildKit layers (issue #34).
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: cryptography-learning-web-tier:local
          cache-from: type=gha,scope=baseline-web-tier
          cache-to: type=gha,mode=max,scope=baseline-web-tier

      - name: Capture current deployable behavior
        # Starts Compose against the Buildx-loaded image (no rebuild) with
        # baseline/content and runs HTTP/GraphQL/terminal characterization
        # checks (issue #12).
        run: ./baseline/run.sh
        env:
          BASELINE_SKIP_BUILD: "1"
