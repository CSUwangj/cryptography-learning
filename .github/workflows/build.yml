name: Build

on:
  push:
    branches:
      - '**'

jobs:
  plan:
    name: Plan changed-path checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      groups: ${{ steps.plan.outputs.groups }}
      encoded: ${{ steps.plan.outputs.encoded }}
      kind: ${{ steps.plan.outputs.kind }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          python3 scripts/test_plan.py range "$BEFORE" "$AFTER" > "$RUNNER_TEMP/test-plan.json"
          python3 - "$RUNNER_TEMP/test-plan.json" >> "$GITHUB_OUTPUT" <<'PY'
          import base64
          import json
          import sys
          from pathlib import Path

          plan = json.loads(Path(sys.argv[1]).read_text())
          groups = {}
          for check in plan["checks"]:
              identifier = check["id"]
              if identifier == "tooling":
                  group = "tooling"
              elif identifier in {"image_smoke", "image_acceptance", "completion_acceptance"}:
                  group = "image"
              elif identifier.startswith(("backend", "relay")) or identifier == "claims":
                  group = "backend"
              else:
                  group = "frontend"
              entry = groups.setdefault(group, {"group": group, "checks": [], "browser": False, "has_install": False})
              entry["checks"].append(identifier)
              entry["browser"] |= identifier in {"image_acceptance", "completion_acceptance", "demo_browser"} or "browser" in identifier
              entry["has_install"] |= identifier == "frontend_install"

          print("groups=" + json.dumps({"include": list(groups.values())}, separators=(",", ":")))
          print("encoded=" + base64.b64encode(Path(sys.argv[1]).read_bytes()).decode())
          print("kind=" + plan["kind"])
          PY

  checks:
    name: Selected ${{ matrix.group }} checks
    needs: plan
    if: ${{ needs.plan.outputs.kind == 'checks' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.groups) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@master
        if: ${{ matrix.group == 'backend' }}
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: actions/cache@v4
        if: ${{ matrix.group == 'backend' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'backend/Cargo.lock') }}
      - uses: actions/setup-node@v4
        if: ${{ matrix.group == 'frontend' || matrix.browser }}
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run frontend install check once
        if: ${{ matrix.group == 'frontend' && matrix.has_install }}
        env:
          PLAN: ${{ needs.plan.outputs.encoded }}
        run: python3 scripts/test_plan.py run --plan "$PLAN" --id frontend_install
      - name: Install frontend dependencies
        if: ${{ !matrix.has_install && (matrix.browser || matrix.group == 'frontend') }}
        working-directory: frontend
        run: npm ci
      - name: Install Chromium for browser checks
        if: ${{ matrix.browser }}
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - uses: docker/setup-buildx-action@v3
        if: ${{ matrix.group == 'image' }}
      - uses: actions/cache@v4
        id: buildkit-cache
        if: ${{ matrix.group == 'image' }}
        with:
          path: |
            /tmp/.buildx-cache-web
            /tmp/.buildx-cache-relay
          key: buildkit-${{ runner.os }}-${{ github.sha }}
          restore-keys: buildkit-${{ runner.os }}-
      - name: Record BuildKit cache state
        if: ${{ matrix.group == 'image' }}
        run: 'echo "BuildKit cache hit: ${{ steps.buildkit-cache.outputs.cache-hit }}"'
      - name: Build web-tier image once
        if: ${{ matrix.group == 'image' }}
        run: |
          rm -rf /tmp/.buildx-cache-web-next
          mkdir -p /tmp/.buildx-cache-web
          cache_from=()
          if [[ -f /tmp/.buildx-cache-web/index.json ]]; then
            cache_from+=(--cache-from type=local,src=/tmp/.buildx-cache-web)
          fi
          docker buildx build --load "${cache_from[@]}" --cache-to type=local,dest=/tmp/.buildx-cache-web-next,mode=max --tag cryptography-learning-web-tier:ci .
          rm -rf /tmp/.buildx-cache-web
          mv /tmp/.buildx-cache-web-next /tmp/.buildx-cache-web
      - name: Build completion relay image once
        if: ${{ matrix.group == 'image' && contains(matrix.checks, 'completion_acceptance') }}
        run: |
          rm -rf /tmp/.buildx-cache-relay-next
          mkdir -p /tmp/.buildx-cache-relay
          cache_from=(--cache-from type=local,src=/tmp/.buildx-cache-web)
          if [[ -f /tmp/.buildx-cache-relay/index.json ]]; then
            cache_from+=(--cache-from type=local,src=/tmp/.buildx-cache-relay)
          fi
          docker buildx build --load "${cache_from[@]}" --cache-to type=local,dest=/tmp/.buildx-cache-relay-next,mode=max --target completion-relay --tag cryptography-learning-completion-relay:ci .
          rm -rf /tmp/.buildx-cache-relay
          mv /tmp/.buildx-cache-relay-next /tmp/.buildx-cache-relay
      - name: Run grouped planned checks
        env:
          PLAN: ${{ needs.plan.outputs.encoded }}
          CHECK_IDS: ${{ join(matrix.checks, ' ') }}
        run: |
          set +e
          status=0
          for check_id in $CHECK_IDS; do
            [[ "$check_id" == frontend_install ]] && continue
            if [[ "$check_id" == completion_acceptance ]]; then
              COMPLETION_SKIP_NPM_CI=1 python3 scripts/test_plan.py run --plan "$PLAN" --id "$check_id" || status=1
            else
              python3 scripts/test_plan.py run --plan "$PLAN" --id "$check_id" || status=1
            fi
          done
          exit "$status"

  aggregate:
    name: Build / aggregate
    if: always()
    needs: [plan, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected check group
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          PLAN_KIND: ${{ needs.plan.outputs.kind }}
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          test "$PLAN_RESULT" = success
          if [[ "$PLAN_KIND" == checks ]]; then
            test "$CHECKS_RESULT" = success
          elif [[ "$PLAN_KIND" != docs-only ]]; then
            echo "Unknown or unavailable check plan: $PLAN_KIND" >&2
            exit 1
          fi
