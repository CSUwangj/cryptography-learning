name: Build

on:
  push:
    branches:
      - '**'
  pull_request:

# Backend and frontend build on every push as independent jobs, plus a
# characterization baseline against the Linux web-tier image. Jobs stay
# separate so a frontend failure still tells you whether the backend compiles
# and whether the container baseline still holds.
#
# There are deliberately no `paths` filters. The two halves are coupled through the
# GraphQL schema, so "only the frontend changed" is not a safe reason to skip the
# backend. The schema parity gate below enforces that coupling on every push.
#
# Each job installs from its lockfile — `cargo --locked` and `npm ci` — so a
# transitive release cannot change what CI built. The publish path needs the same
# treatment and is CSUAuroraLab/cryptography-learning-infra#5.

jobs:
  workflow-contract:
    name: Workflow contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test release workflow contract
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        # Includes schema_parity: backend SDL vs frontend/schema/schema.gql.
        run: cargo test --locked -- --nocapture

      - name: Build
        run: cargo build --locked --release

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node is exact-pinned in frontend/.nvmrc (and package.json engines);
          # npm 11 ships with that Node release and is also listed under engines.
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install from the lockfile
        run: npm ci

      - name: Verify GraphQL codegen is up to date
        # Client-preset output under src/transport/generated must match a fresh
        # `npm run gen` (issue #16 clean-tree contract).
        run: |
          npm run gen
          if [ -n "$(git status --porcelain -- .)" ]; then
            echo "GraphQL codegen left the frontend tree dirty:"
            git status --porcelain -- .
            git diff -- .
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        # VITE_FEEDBACK_URL is baked into the bundle at build time, so it has
        # to be set here to produce the bundle the site actually ships.
        run: npm run build
        env:
          VITE_FEEDBACK_URL: https://github.com/CSUAuroraLab/ISSUE-COLLECTOR/issues/new/choose

  baseline:
    name: Characterization baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build and load web-tier image
        # Restore/export BuildKit layers via a dedicated GHA cache scope so cold
        # and warm runs share intermediate stages. Host-side node_modules, the
        # frontend bundle, and GraphQL codegen output are not path-cached here —
        # only opaque BuildKit layers (issue #34).
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: cryptography-learning-web-tier:local
          cache-from: type=gha,scope=baseline-web-tier
          cache-to: type=gha,mode=max,scope=baseline-web-tier

      - name: Capture current deployable behavior
        # Starts Compose against the Buildx-loaded image (no rebuild) with
        # baseline/content and runs HTTP/GraphQL/terminal characterization
        # checks (issue #12).
        run: ./acceptance/run.sh cryptography-learning-web-tier:local --mode smoke
        env:
          ACCEPTANCE_ARTIFACT_DIR: ${{ runner.temp }}/baseline-artifacts
      - name: Upload acceptance diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/baseline-artifacts

  container-browser:
    name: Container browser acceptance
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: cryptography-learning-web-tier:ci
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            IMAGE_VERSION=${{ github.ref_name }}
      - name: Record SQLite runtime version from candidate image
        run: |
          image_identity="$(docker image inspect cryptography-learning-web-tier:ci --format 'local@{{.Id}}')"
          diagnostic_command=(
            docker run --rm
            --entrypoint /app/backend
            cryptography-learning-web-tier:ci
            --static /www
            --print-sqlite-version
          )
          printf -v command '%q ' "${diagnostic_command[@]}"
          command="${command% }"
          output="$("${diagnostic_command[@]}")"
          case "$output" in
            sqlite_version=*) version="${output#sqlite_version=}" ;;
            *) echo "Unexpected SQLite diagnostic output: $output" >&2; exit 1 ;;
          esac
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(printf '%s\n%s\n' 3.51.3 "$version" | sort -V | head -n1)" = "3.51.3"
          {
            printf 'image=%s\n' "$image_identity"
            printf 'command=%s\n' "$command"
            printf 'output=%s\n' "$output"
            printf 'ci_run_url=%s/actions/runs/%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } | tee sqlite-runtime-evidence.txt
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend test dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium for pull-request acceptance
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Install release browsers
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run acceptance against the candidate image
        run: ./acceptance/run.sh cryptography-learning-web-tier:ci --mode ${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'pr' }}
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:18080
          WEB_HTTP_PORT: "18080"
          ACCEPTANCE_ARTIFACT_DIR: ${{ runner.temp }}/browser-artifacts
      - name: Record image digest
        run: docker image inspect cryptography-learning-web-tier:ci --format 'local@{{.Id}}' | tee image-digest.txt
      - name: Upload candidate-image runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: web-tier-runtime-evidence-${{ github.sha }}
          path: |
            image-digest.txt
            sqlite-runtime-evidence.txt
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/browser-artifacts
          if-no-files-found: ignore

  macos14-chrome-cmd-v:
    name: macOS 14 Chrome Cmd+V compatibility
    # Native keyboard compatibility is evidence-gathering, not a web-image
    # release gate. Failures remain visible in CI without blocking releases.
    continue-on-error: true
    runs-on: macos-14
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend test dependencies
        working-directory: frontend
        run: npm ci
      - name: Install branded stable Google Chrome
        working-directory: frontend
        run: npx playwright install chrome
      - name: Record macOS version and build
        id: macos-version
        run: |
          product_version="$(sw_vers -productVersion)"
          build_version="$(sw_vers -buildVersion)"
          echo "value=macOS ${product_version} (build ${build_version})" >> "$GITHUB_OUTPUT"
      - name: Record macOS 14 Chrome Cmd+V compatibility evidence
        working-directory: frontend
        run: npx playwright test --project=chromium --grep 'macos14-chrome-cmd-v'
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
          PLAYWRIGHT_ARTIFACT_DIR: ${{ runner.temp }}/native-terminal-compatibility
          NATIVE_COMPAT_OS_VERSION: ${{ steps.macos-version.outputs.value }}
          NATIVE_COMPAT_COMMAND: Cmd+V dispatched through branded Chrome on the real macOS runner
      - name: Upload native compatibility diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos14-chrome-cmd-v-${{ github.sha }}
          path: ${{ runner.temp }}/native-terminal-compatibility
          if-no-files-found: warn
