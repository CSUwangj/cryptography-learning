overwrite: true
schema:
  - "schema/schema.gql"
documents:
  - "src/practice/graphql/**/*.gql"
  - "src/transport/graphql/**/*.gql"
generates:
  src/transport/generated/graphql.tsx:
    plugins:
    - "typescript"
    - "typescript-operations"
    - "typescript-react-apollo"
    config:
      withComponent: false
      withHOC: false
      withHooks: true
      gqlImport: graphql.macro#gql
      apolloReactCommonImportFrom: "@apollo/client"
      apolloReactHooksImportFrom: "@apollo/client"
  src/transport/generated/fragmentTypes.json:
    plugins:
      - fragment-matcher
