query LearningCatalog($language: String!) {
  learning(language: $language) {
    lessonCategories {
      id
      name {
        lang
        text
      }
      lessons {
        id
        title
      }
    }
  }
}

query LessonDocuments($lessonId: String!, $language: String!) {
  lessonDocuments(lessonId: $lessonId, language: $language) {
    lesson
    locale
  }
}
