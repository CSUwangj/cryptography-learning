[package]
name = "completion-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Host Completion Relay: sign and deliver Completion Evidence"
publish = false

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive"] }
completion-claims = { path = "../../crates/completion-claims" }
ed25519-dalek = { version = "3", features = ["pem", "rand_core"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
reqwest = { version = "0.12", default-features = true }
ron = ">=0.8.0, <0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"

[dev-dependencies]
ed25519-dalek = { version = "3", features = ["pem"] }
libc = "0.2.189"
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "signal", "time", "io-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
