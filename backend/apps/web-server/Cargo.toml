[package]
name = "cryptography-learning-backend"
version = "0.1.1"
authors = ["CSUwangj <CSUwangj@protonmail.com>"]
edition = "2024"
rust-version = "1.97"

[dependencies]
async-graphql = { version = "7.2", features = ["playground"] }
async-graphql-axum = "7.2"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
mime_guess = "2"
ron = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "signal", "time", "sync", "fs"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "signal", "time", "sync", "fs", "test-util"] }
tracing-test = "0.2"
