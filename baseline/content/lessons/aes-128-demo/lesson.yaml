  - id: enter-input
    inputs:
      - {input: key, prompt: key}
      - {input: plaintext, prompt: plaintext}
      - {input: ciphertext, prompt: ciphertext}
  - id: expand-key
    execute:
      graph: expand
      bindings:
        key.value: {input: key}
    presentation:
      kind: key-expansion
      algorithm: AES
      variant: 128
  - id: encrypt
    execute:
      graph: encrypt
